name: AI Safety publication gate

# The ChatGPT AI Safety Engine prepares and verifies editions at 06:00 Adelaide
# Monday/Thursday. This independent read-only gate checks the result afterwards.
# 23:30 UTC Sun/Wed = Mon/Thu 09:00 (ACST) or 10:00 (ACDT).
on:
  push:
    branches: [main]
    paths:
      - "ai-safety/**"
      - "scripts/check-ai-safety-package.mjs"
      - "scripts/verify-ai-safety.mjs"
      - "scripts/verify-ai-safety-destinations.mjs"
      - "scripts/prepare-ai-safety-release.mjs"
      - "scripts/ai-safety-html.mjs"
      - "scripts/sync-ai-safety.mjs"
      - "tests/ai-safety-package.test.mjs"
      - "tests/ai-safety-publication.test.mjs"
      - "tests/ai-safety-handoff.test.mjs"
      - ".github/workflows/ai-safety-publication.yml"
  schedule:
    - cron: "30 23 * * 0,3"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  verify-edition:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Test canonical rendering and publication safeguards
        run: node --test tests/ai-safety-publication.test.mjs tests/ai-safety-handoff.test.mjs tests/ai-safety-package.test.mjs
      - name: Validate edition, dated metadata, source ledger and dashboard links
        run: node scripts/verify-ai-safety.mjs local
      - name: Wait for and confirm the current edition is live
        env:
          AI_SAFETY_MIRROR_URL: https://dop-ai-safety-observatory.sammielee.chatgpt.site/
          AI_SAFETY_RECEIPT_PATH: artifacts/ai-safety-publication-receipt.json
        run: |
          for attempt in {1..10}; do
            if node scripts/verify-ai-safety-destinations.mjs; then exit 0; fi
            if [[ "$attempt" != "10" ]]; then sleep 15; fi
          done
          exit 1
      - name: Preserve independent destination results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-safety-publication-receipt
          path: artifacts/ai-safety-publication-receipt.json
          if-no-files-found: warn
      - name: Open or update one missing-edition alert
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="AI Safety publication needs attention"
          issue="$(gh issue list --state open --json number,title --jq '.[] | select(.title == "AI Safety publication needs attention") | .number' | head -n 1)"
          message="The Monday/Thursday AI Safety publication gate failed. Check this workflow run, independent receipt and both publication destinations before claiming publication. Do not roll forward an old story or alter scores without verified evidence. Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          if [[ -n "$issue" ]]; then
            gh issue comment "$issue" --body "$message"
          else
            gh issue create --title "$title" --body "$message"
          fi
      - name: Close the alert once publishing is verified
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          issue="$(gh issue list --state open --json number,title --jq '.[] | select(.title == "AI Safety publication needs attention") | .number' | head -n 1)"
          if [[ -n "$issue" ]]; then
            gh issue close "$issue" --comment "The latest due Monday/Thursday edition is now verified on the main public site and Sites mirror."
          fi

