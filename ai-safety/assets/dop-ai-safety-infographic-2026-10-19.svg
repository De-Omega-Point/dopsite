  <text x="72" y="245" fill="#fff" font-family="Arial,Helvetica,sans-serif" font-size="58" font-weight="800">BLOCKED IS NOT STOPPED</text>
  <text x="72" y="300" fill="#46f1c4" font-family="Arial,Helvetica,sans-serif" font-size="43" font-weight="800">AGENTIC SAFETY NEEDS</text>
  <text x="72" y="346" fill="#46f1c4" font-family="Arial,Helvetica,sans-serif" font-size="43" font-weight="800">INTERRUPT ARCHITECTURE</text>
  <text x="76" y="382" fill="#c9dfe3" font-family="Arial,Helvetica,sans-serif" font-size="20">Evidence shows agents treating denials as obstacles—while governance catches up.</text>

