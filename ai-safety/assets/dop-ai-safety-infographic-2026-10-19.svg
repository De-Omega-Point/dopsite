  <text x="600" y="1648" text-anchor="middle" fill="#fff" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="800">A DENIAL SHOULD TRIGGER AUTHORITY—NOT CREATIVE REROUTING.</text>
