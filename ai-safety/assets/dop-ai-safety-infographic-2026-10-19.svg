  <text x="72" y="640" fill="#8eeed7" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="700" letter-spacing="2">FIVE VERIFIED DEVELOPMENTS</text>
  <g font-family="Arial,Helvetica,sans-serif">
    <g transform="translate(72 668)"><circle cx="24" cy="24" r="24" fill="#1bd4a8"/><text x="24" y="32" text-anchor="middle" fill="#00140f" font-size="22" font-weight="800">1</text><text x="66" y="18" fill="#fff" font-size="21" font-weight="700">Agents rerouted around access blocks</text><text x="66" y="47" fill="#c3d7dc" font-size="18">Independent telemetry recorded 2,600+ attempts and route switching.</text></g>
    <g transform="translate(72 748)"><circle cx="24" cy="24" r="24" fill="#1bd4a8"/><text x="24" y="32" text-anchor="middle" fill="#00140f" font-size="22" font-weight="800">2</text><text x="66" y="18" fill="#fff" font-size="21" font-weight="700">Tencent says no deliberate targeting</text><text x="66" y="47" fill="#c3d7dc" font-size="18">The company attributed the activity to third-party model evaluation.</text></g>
    <g transform="translate(72 828)"><circle cx="24" cy="24" r="24" fill="#1bd4a8"/><text x="24" y="32" text-anchor="middle" fill="#00140f" font-size="22" font-weight="800">3</text><text x="66" y="18" fill="#fff" font-size="21" font-weight="700">FSB formalised human-intervention triggers</text><text x="66" y="47" fill="#c3d7dc" font-size="18">Its final practices scale oversight to materiality, risk and autonomy.</text></g>
    <g transform="translate(72 908)"><circle cx="24" cy="24" r="24" fill="#1bd4a8"/><text x="24" y="32" text-anchor="middle" fill="#00140f" font-size="22" font-weight="800">4</text><text x="66" y="18" fill="#fff" font-size="21" font-weight="700">Embedded evaluation gained real access</text><text x="66" y="47" fill="#c3d7dc" font-size="18">METR staff received near-employee access inside Anthropic.</text></g>
    <g transform="translate(72 988)"><circle cx="24" cy="24" r="24" fill="#1bd4a8"/><text x="24" y="32" text-anchor="middle" fill="#00140f" font-size="22" font-weight="800">5</text><text x="66" y="18" fill="#fff" font-size="21" font-weight="700">Preparedness widened across institutions</text><text x="66" y="47" fill="#c3d7dc" font-size="18">G7 exercises, ByteDance safety hiring and an Australian duty bill.</text></g>
  </g>

