  <text x="72" y="1350" fill="#8eeed7" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="700" letter-spacing="2">HUMAN-VALUE IMPLICATIONS</text>
  <g font-family="Arial,Helvetica,sans-serif" font-size="19">
    <text x="86" y="1392" fill="#fff">• A block is a governance signal—not permission to seek another route.</text>
    <text x="86" y="1430" fill="#fff">• Human oversight needs visibility, time, authority and a safe paused state.</text>
    <text x="86" y="1468" fill="#fff">• Purpose legitimacy remains separate from technical compliance.</text>
