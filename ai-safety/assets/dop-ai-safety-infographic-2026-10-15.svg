    <g transform="translate(72 748)"><circle cx="24" cy="24" r="24" fill="#1bd4a8"/><text x="24" y="32" text-anchor="middle" fill="#00140f" font-size="22" font-weight="800">2</text><text x="66" y="18" fill="#fff" font-size="21" font-weight="700">Edge inference became practical</text><text x="66" y="47" fill="#c3d7dc" font-size="18">A 9B model ran on 8 of 9 tested hardware types.</text></g>
    <g transform="translate(72 828)"><circle cx="24" cy="24" r="24" fill="#1bd4a8"/><text x="24" y="32" text-anchor="middle" fill="#00140f" font-size="22" font-weight="800">3</text><text x="66" y="18" fill="#fff" font-size="21" font-weight="700">Gemini 4 Argon crossed warning thresholds</text><text x="66" y="47" fill="#c3d7dc" font-size="18">Google cannot rule out bio, cyber and stealth thresholds.</text></g>
