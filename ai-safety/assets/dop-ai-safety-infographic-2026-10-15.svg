    <g transform="translate(72 988)"><circle cx="24" cy="24" r="24" fill="#1bd4a8"/><text x="24" y="32" text-anchor="middle" fill="#00140f" font-size="22" font-weight="800">5</text><text x="66" y="18" fill="#fff" font-size="21" font-weight="700">Assurance capacity is scaling</text><text x="66" y="47" fill="#c3d7dc" font-size="18">NVIDIA pledged US$250m in UK safety compute over five years.</text></g>
