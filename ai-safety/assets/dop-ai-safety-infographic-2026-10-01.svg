<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="1800" viewBox="0 0 1200 1800">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#01070d"/><stop offset=".48" stop-color="#06243a"/><stop offset="1" stop-color="#020d16"/></linearGradient>
  </defs>
  <rect width="1200" height="1800" fill="url(#bg2)"/>
  <g transform="translate(64 54)">
    <image xlink:href="de-omega-point-emblem-v2.png" width="100" height="100" preserveAspectRatio="xMinYMid meet"/>
    <text x="1072" y="42" text-anchor="end" fill="#20f28a" font-family="Arial" font-size="20" font-weight="800" letter-spacing="3">AI SAFETY INTELLIGENCE</text>
    <text x="1072" y="77" text-anchor="end" fill="#9db3c0" font-family="Arial" font-size="19">1 OCTOBER 2026 · AUSTRALIA/ADELAIDE</text>
    <path d="M0 120h1072" stroke="#22d7ff" stroke-opacity=".5"/>
    <text x="0" y="205" fill="#f7fbff" font-family="Arial Narrow, Arial" font-size="66" font-weight="900">CONTROL MOVES INTO</text>
    <text x="0" y="270" fill="#f7fbff" font-family="Arial Narrow, Arial" font-size="66" font-weight="900">THE RUNTIME</text>
    <text x="0" y="316" fill="#22d7ff" font-family="Arial" font-size="28" font-weight="700">The assurance architecture is forming. Proof and enforcement still lag.</text>

    <g transform="translate(0 370)">
      <text fill="#20f28a" font-family="Arial" font-size="20" font-weight="800" letter-spacing="3">FIVE CORE INDICATORS · DΩP EDITORIAL JUDGEMENT</text>
      <g transform="translate(0 38)">
        <rect width="204" height="145" rx="14" fill="#061d2c" stroke="#ff982f"/><text x="18" y="38" fill="#9db3c0" font-family="Arial" font-size="16">THREAT</text><text x="18" y="91" fill="#f7fbff" font-family="Arial" font-size="50" font-weight="900">76</text><text x="18" y="124" fill="#ff982f" font-family="Arial" font-size="16" font-weight="800">HIGH · UNCHANGED</text>
        <rect x="217" width="204" height="145" rx="14" fill="#061d2c" stroke="#20f28a"/><text x="235" y="38" fill="#9db3c0" font-family="Arial" font-size="16">ASSURANCE</text><text x="235" y="91" fill="#f7fbff" font-family="Arial" font-size="50" font-weight="900">64</text><text x="235" y="124" fill="#20f28a" font-family="Arial" font-size="16" font-weight="800">62 → 64</text>
        <rect x="434" width="204" height="145" rx="14" fill="#061d2c" stroke="#20f28a"/><text x="452" y="38" fill="#9db3c0" font-family="Arial" font-size="16">CONTROL DEBT</text><text x="452" y="91" fill="#f7fbff" font-family="Arial" font-size="50" font-weight="900">+12</text><text x="452" y="124" fill="#20f28a" font-family="Arial" font-size="16" font-weight="800">14 → 12</text>
        <rect x="651" width="204" height="145" rx="14" fill="#061d2c" stroke="#22d7ff"/><text x="669" y="38" fill="#9db3c0" font-family="Arial" font-size="16">GOVERNANCE</text><text x="669" y="91" fill="#f7fbff" font-family="Arial" font-size="50" font-weight="900">69</text><text x="669" y="124" fill="#20f28a" font-family="Arial" font-size="16" font-weight="800">66 → 69</text>
        <rect x="868" width="204" height="145" rx="14" fill="#061d2c" stroke="#ff4c4f"/><text x="886" y="38" fill="#9db3c0" font-family="Arial" font-size="16">AWARENESS</text><text x="886" y="91" fill="#f7fbff" font-family="Arial" font-size="43" font-weight="900">84 DAYS</text><text x="886" y="124" fill="#ff4c4f" font-family="Arial" font-size="16" font-weight="800">MEASURED · UNCHANGED</text>
      </g>
    </g>

    <g transform="translate(0 610)">
      <text fill="#20f28a" font-family="Arial" font-size="20" font-weight="800" letter-spacing="3">FIVE VERIFIED DEVELOPMENTS</text>
      <g font-family="Arial">
        <rect y="35" width="1072" height="115" rx="12" fill="#061d2c" stroke="#1b526b"/><text x="26" y="74" fill="#20f28a" font-size="18" font-weight="800">01 · MONDAY BASELINE</text><text x="26" y="109" fill="#f7fbff" font-size="25" font-weight="800">Unauthorised agent action + 84-day institutional-awareness gap</text><text x="26" y="137" fill="#9db3c0" font-size="17">Real-world incident; harm bounded; authority and notification controls failed.</text>
        <rect y="164" width="1072" height="115" rx="12" fill="#061d2c" stroke="#1b526b"/><text x="26" y="203" fill="#20f28a" font-size="18" font-weight="800">02 · RUNTIME CONTROL</text><text x="26" y="238" fill="#f7fbff" font-size="25" font-weight="800">NVIDIA launches OpenShell + out-of-band Sentry architecture</text><text x="26" y="266" fill="#9db3c0" font-size="17">Verified launch; performance and containment claims remain vendor-assessed.</text>
        <rect y="293" width="1072" height="115" rx="12" fill="#061d2c" stroke="#1b526b"/><text x="26" y="332" fill="#20f28a" font-size="18" font-weight="800">03 · COMMON COMMITMENTS</text><text x="26" y="367" fill="#f7fbff" font-size="25" font-weight="800">Major US labs sign a voluntary frontier-safety pact</text><text x="26" y="395" fill="#9db3c0" font-size="17">Internal monitoring, external audits and review—without legal enforcement.</text>
        <rect y="422" width="1072" height="115" rx="12" fill="#061d2c" stroke="#1b526b"/><text x="26" y="461" fill="#20f28a" font-size="18" font-weight="800">04 · AUSTRALIAN SUPERVISION</text><text x="26" y="496" fill="#f7fbff" font-size="25" font-weight="800">ASIC will review AI in banks’ customer-facing activities</text><text x="26" y="524" fill="#9db3c0" font-size="17">A shift from principles to scrutiny of consumer outcomes and existing duties.</text>
        <rect y="551" width="1072" height="115" rx="12" fill="#061d2c" stroke="#1b526b"/><text x="26" y="590" fill="#20f28a" font-size="18" font-weight="800">05 · CONTINUITY JUDGEMENT</text><text x="26" y="625" fill="#f7fbff" font-size="25" font-weight="800">No new evidence justifies a higher threat score</text><text x="26" y="653" fill="#9db3c0" font-size="17">The week’s change is assurance architecture—not a new incident or threshold.</text>
      </g>
    </g>

    <g transform="translate(0 1340)">
      <rect width="1072" height="265" rx="18" fill="#041722" stroke="#20f28a" stroke-width="2"/>
      <text x="30" y="46" fill="#20f28a" font-family="Arial" font-size="20" font-weight="800" letter-spacing="3">THE DΩP ASSURANCE PATHWAY</text>
      <g transform="translate(30 80)" font-family="Arial" font-weight="800" text-anchor="middle">
        <rect width="170" height="70" rx="35" fill="#0b3144" stroke="#22d7ff"/><text x="85" y="43" fill="#f7fbff" font-size="19">BOUND SCOPE</text>
        <path d="M180 35h40" stroke="#20f28a" stroke-width="4"/>
        <rect x="230" width="170" height="70" rx="35" fill="#0b3144" stroke="#22d7ff"/><text x="315" y="43" fill="#f7fbff" font-size="19">MONITOR</text>
        <path d="M410 35h40" stroke="#20f28a" stroke-width="4"/>
        <rect x="460" width="170" height="70" rx="35" fill="#0b3144" stroke="#22d7ff"/><text x="545" y="43" fill="#f7fbff" font-size="19">CONTAIN</text>
        <path d="M640 35h40" stroke="#20f28a" stroke-width="4"/>
        <rect x="690" width="170" height="70" rx="35" fill="#0b3144" stroke="#22d7ff"/><text x="775" y="43" fill="#f7fbff" font-size="19">NOTIFY</text>
        <path d="M870 35h40" stroke="#20f28a" stroke-width="4"/>
        <rect x="920" width="122" height="70" rx="35" fill="#20f28a"/><text x="981" y="43" fill="#032015" font-size="19">ACCOUNT</text>
      </g>
      <text x="30" y="195" fill="#f7fbff" font-family="Arial" font-size="24" font-weight="800">Human-value test:</text>
      <text x="250" y="195" fill="#c7d7df" font-family="Arial" font-size="22">visibility · comprehension · time · authority · contestability · remedy</text>
      <text x="30" y="232" fill="#ff982f" font-family="Arial" font-size="18" font-weight="800">DΩP scores are analytical judgements—not probabilities of catastrophe.</text>
    </g>

    <text x="0" y="1690" fill="#20f28a" font-family="Arial" font-size="27" font-weight="900">CORE READ</text>
    <text x="0" y="1730" fill="#f7fbff" font-family="Arial" font-size="25" font-weight="800">The control plane is becoming the next AI-safety market.</text>
    <text x="0" y="1766" fill="#9db3c0" font-family="Arial" font-size="19">The proof standard is independent testing across real deployments—not architecture diagrams.</text>
  </g>
</svg>

