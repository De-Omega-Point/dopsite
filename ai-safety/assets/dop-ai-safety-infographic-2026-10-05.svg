<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="1800" viewBox="0 0 1200 1800"><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#01070d"/><stop offset=".55" stop-color="#06243a"/><stop offset="1" stop-color="#020d16"/></linearGradient></defs><rect width="1200" height="1800" fill="url(#bg)"/><g transform="translate(70 55)"><image xlink:href="de-omega-point-emblem-v2.png" width="105" height="105" preserveAspectRatio="xMinYMid meet"/><text x="135" y="50" fill="#20f28a" font-family="Arial" font-size="26" font-weight="900" letter-spacing="4">DE-OMEGA-POINT</text><text x="135" y="88" fill="#9db3c0" font-family="Arial" font-size="19">AI SAFETY INTELLIGENCE · 5 OCTOBER 2026</text></g><text x="70" y="245" fill="#f7fbff" font-family="Arial Narrow,Arial" font-size="50" font-weight="900">THE INCIDENT-MEASUREMENT GAP</text><text x="70" y="305" fill="#22d7ff" font-family="Arial" font-size="28" font-weight="700">More than 100 notices materially broaden exposure—without defining severity.</text><text x="70" y="347" fill="#9db3c0" font-family="Arial" font-size="19">FACTS, INFERENCE AND DΩP JUDGEMENT ARE SEPARATED BELOW.</text><g transform="translate(70 395)" font-family="Arial"><rect width="1060" height="235" rx="26" fill="#041926" stroke="#20f28a"/><text x="35" y="48" fill="#20f28a" font-size="20" font-weight="800">FIVE CORE INDICATORS · DΩP EDITORIAL EXCEPT WHERE MARKED</text><g fill="#f7fbff" font-size="44" font-weight="900"><text x="35" y="125">80</text><text x="245" y="125">65</text><text x="455" y="125">+15</text><text x="665" y="125">&gt;100</text><text x="875" y="125">73</text></g><g fill="#9db3c0" font-size="18"><text x="35" y="165">THREAT</text><text x="245" y="165">ASSURANCE</text><text x="455" y="165">CONTROL DEBT</text><text x="665" y="165">NOTIFIED*</text><text x="875" y="165">GOVERNANCE</text></g><text x="35" y="205" fill="#ffb24a" font-size="15">* MEASURED NOTICE COUNT — NOT A CONFIRMED BREACH OR HARM COUNT</text></g><g transform="translate(70 675)" font-family="Arial"><text x="0" y="0" fill="#20f28a" font-size="23" font-weight="900" letter-spacing="2">FIVE VERIFIED DEVELOPMENTS</text><g font-size="20"><g transform="translate(0 35)"><rect width="1060" height="115" rx="20" fill="#052033"/><text x="28" y="44" fill="#22d7ff" font-weight="900">01  &gt;100 ORGANISATIONS NOTIFIED</text><text x="28" y="80" fill="#c7d7df">Exposure breadth rose; case severity and success remain undisclosed.</text></g><g transform="translate(0 165)"><rect width="1060" height="115" rx="20" fill="#052033"/><text x="28" y="44" fill="#22d7ff" font-weight="900">02  ROUGHLY 50 PETABYTES UNDER REVIEW</text><text x="28" y="80" fill="#c7d7df">Retrospective forensics expose the cost of weak agent observability.</text></g><g transform="translate(0 295)"><rect width="1060" height="115" rx="20" fill="#052033"/><text x="28" y="44" fill="#22d7ff" font-weight="900">03  FTC INDUSTRY PROBE REPORTED</text><text x="28" y="80" fill="#c7d7df">An investigation is not a finding, but it introduces enforceability.</text></g><g transform="translate(0 425)"><rect width="1060" height="115" rx="20" fill="#052033"/><text x="28" y="44" fill="#22d7ff" font-weight="900">04  APPLE STRENGTHENS FULL-DISK CONSENT</text><text x="28" y="80" fill="#c7d7df">Meaningful consent must reveal the true scope of agent authority.</text></g><g transform="translate(0 555)"><rect width="1060" height="115" rx="20" fill="#052033"/><text x="28" y="44" fill="#22d7ff" font-weight="900">05  SAFETY CULTURE ENTERS GOVERNANCE</text><text x="28" y="80" fill="#c7d7df">Launch gates, escalation rights and board evidence become measurable.</text></g></g></g><g transform="translate(70 1400)" font-family="Arial"><text x="0" y="0" fill="#20f28a" font-size="23" font-weight="900" letter-spacing="2">FROM SIGNAL TO ASSURANCE</text><path d="M40 85h900" stroke="#22d7ff" stroke-width="7"/><g fill="#031522" stroke="#20f28a" stroke-width="6"><circle cx="40" cy="85" r="28"/><circle cx="265" cy="85" r="28"/><circle cx="490" cy="85" r="28"/><circle cx="715" cy="85" r="28"/><circle cx="940" cy="85" r="28"/></g><g fill="#f7fbff" font-size="17" text-anchor="middle"><text x="40" y="140">NOTICE</text><text x="265" y="140">CLASSIFY</text><text x="490" y="140">VERIFY</text><text x="715" y="140">REMEDIATE</text><text x="940" y="140">LEARN</text></g><rect x="0" y="190" width="1060" height="135" rx="22" fill="#041926" stroke="#ffb24a"/><text x="28" y="230" fill="#ffb24a" font-size="19" font-weight="900">HUMAN-VALUE TEST</text><text x="28" y="268" fill="#c7d7df" font-size="20">Did people receive notice, explanation, contestability and remedy?</text><text x="28" y="302" fill="#c7d7df" font-size="20">If not, technical containment is incomplete accountability.</text></g><text x="70" y="1760" fill="#20f28a" font-family="Arial" font-size="22" font-weight="900">FORWARD, ALWAYS.  ·  DE-OMEGA-POINT.COM/AI-SAFETY/</text></svg>
