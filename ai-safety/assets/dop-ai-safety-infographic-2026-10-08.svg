  <g transform="translate(70 55)"><image xlink:href="de-omega-point-emblem-v2.png" width="105" height="105" preserveAspectRatio="xMinYMid meet"/><text x="135" y="50" fill="#20f28a" font-family="Arial" font-size="26" font-weight="900" letter-spacing="4">DE-OMEGA-POINT</text><text x="135" y="88" fill="#9db3c0" font-family="Arial" font-size="19">AI SAFETY INTELLIGENCE · 8 OCTOBER 2026</text></g>
  <text x="70" y="240" fill="#f7fbff" font-family="Arial Narrow,Arial" font-size="48" font-weight="900">CONTROL MOVES OUTSIDE THE AGENT</text><text x="70" y="298" fill="#22d7ff" font-family="Arial" font-size="27" font-weight="700">The architecture is catching up. Independent proof must follow.</text><text x="70" y="340" fill="#9db3c0" font-family="Arial" font-size="18">DΩP SCORES ARE EDITORIAL JUDGEMENTS — NOT CATASTROPHE PROBABILITIES.</text>
  <g transform="translate(70 385)" font-family="Arial"><rect width="1060" height="235" rx="26" fill="#041926" stroke="#20f28a"/><text x="35" y="48" fill="#20f28a" font-size="20" font-weight="800">FIVE CORE INDICATORS</text><g fill="#f7fbff" font-size="43" font-weight="900"><text x="35" y="125">80</text><text x="245" y="125">68</text><text x="455" y="125">+12</text><text x="665" y="125">72.4%</text><text x="875" y="125">76</text></g><g fill="#9db3c0" font-size="17"><text x="35" y="165">THREAT · SAME</text><text x="245" y="165">ASSURANCE ↑</text><text x="455" y="165">CONTROL DEBT ↓</text><text x="665" y="165">OSWORLD*</text><text x="875" y="165">GOVERNANCE ↑</text></g><text x="35" y="205" fill="#ffb24a" font-size="15">* ANTHROPIC-RUN OFFLINE SUBSET — DEVELOPER BENCHMARK, NOT AN INCIDENT RATE</text></g>
  <g transform="translate(70 665)" font-family="Arial"><text x="0" y="0" fill="#20f28a" font-size="23" font-weight="900" letter-spacing="2">FIVE VERIFIED DEVELOPMENTS</text><g font-size="19"><g transform="translate(0 35)"><rect width="1060" height="108" rx="20" fill="#052033"/><text x="28" y="41" fill="#22d7ff" font-weight="900">01  RUNTIME CONTROL MOVES OUTSIDE THE AGENT</text><text x="28" y="76" fill="#c7d7df">NVIDIA describes independent policy enforcement; performance remains vendor-claimed.</text></g><g transform="translate(0 157)"><rect width="1060" height="108" rx="20" fill="#052033"/><text x="28" y="41" fill="#22d7ff" font-weight="900">02  CHEAP COMPUTER USE DIFFUSES CAPABILITY</text><text x="28" y="76" fill="#c7d7df">Haiku 5.5 lifts a controlled OSWorld subset from 15.7% to 72.4%.</text></g><g transform="translate(0 279)"><rect width="1060" height="108" rx="20" fill="#052033"/><text x="28" y="41" fill="#22d7ff" font-weight="900">03  CYBER ACCESS BECOMES TIERED</text><text x="28" y="76" fill="#c7d7df">Verified access restores utility but raises identity and oversight duties.</text></g><g transform="translate(0 401)"><rect width="1060" height="108" rx="20" fill="#052033"/><text x="28" y="41" fill="#22d7ff" font-weight="900">04  LABS SUPPORT MANDATORY AUSTRALIAN REPORTING</text><text x="28" y="76" fill="#c7d7df">Support is not enacted law; materiality and evidence rules remain open.</text></g><g transform="translate(0 523)"><rect width="1060" height="108" rx="20" fill="#052033"/><text x="28" y="41" fill="#22d7ff" font-weight="900">05  ASIC LINKS AI CONTROL TO CUSTOMER OUTCOMES</text><text x="28" y="76" fill="#c7d7df">Banking supervision turns human-value claims into an operational test.</text></g></g></g>
  <g transform="translate(70 1355)" font-family="Arial"><text x="0" y="0" fill="#20f28a" font-size="23" font-weight="900" letter-spacing="2">ASSURANCE PATHWAY</text><path d="M50 82h900" stroke="#22d7ff" stroke-width="7"/><g fill="#031522" stroke="#20f28a" stroke-width="6"><circle cx="50" cy="82" r="27"/><circle cx="275" cy="82" r="27"/><circle cx="500" cy="82" r="27"/><circle cx="725" cy="82" r="27"/><circle cx="950" cy="82" r="27"/></g><g fill="#f7fbff" font-size="16" text-anchor="middle"><text x="50" y="137">CAPABILITY</text><text x="275" y="137">AUTHORITY</text><text x="500" y="137">CONTROL PLANE</text><text x="725" y="137">EVIDENCE</text><text x="950" y="137">ACCOUNTABILITY</text></g><rect x="0" y="185" width="1060" height="175" rx="22" fill="#041926" stroke="#ffb24a"/><text x="28" y="228" fill="#ffb24a" font-size="19" font-weight="900">HUMAN-VALUE TEST</text><text x="28" y="267" fill="#c7d7df" font-size="20">Do people retain visibility, comprehension, time and practical authority?</text><text x="28" y="302" fill="#c7d7df" font-size="20">Can affected people contest, correct and obtain remedy?</text><text x="28" y="337" fill="#c7d7df" font-size="20">If not, “human in the loop” is Human Theatre.</text></g>
  <text x="70" y="1760" fill="#20f28a" font-family="Arial" font-size="22" font-weight="900">FORWARD, ALWAYS.  ·  DE-OMEGA-POINT.COM/AI-SAFETY/</text>
