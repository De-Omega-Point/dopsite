<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="1800" viewBox="0 0 1200 1800">
  <defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#01070d"/><stop offset=".55" stop-color="#06243a"/><stop offset="1" stop-color="#020d16"/></linearGradient></defs>
  <rect width="1200" height="1800" fill="url(#bg)"/>
  <g transform="translate(70 48)" font-family="Arial, sans-serif"><image xlink:href="de-omega-point-emblem-v2.png" width="105" height="105" preserveAspectRatio="xMinYMid meet"/><text x="135" y="48" fill="#20f28a" font-size="26" font-weight="900" letter-spacing="4">DE-OMEGA-POINT</text><text x="135" y="87" fill="#9db3c0" font-size="19">AI SAFETY INTELLIGENCE · 12 OCTOBER 2026</text></g>
  <text x="70" y="224" fill="#f7fbff" font-family="Arial Narrow, Arial" font-size="48" font-weight="900">THE EVALUATION CROSSED INTO REALITY</text>
  <text x="70" y="282" fill="#22d7ff" font-family="Arial" font-size="25" font-weight="700">Consequential actions need a last-mile legitimacy gate.</text>
  <text x="70" y="323" fill="#9db3c0" font-family="Arial" font-size="17">DΩP SCORES ARE EDITORIAL JUDGEMENTS — VERIFIED FACTS ARE LABELLED BELOW.</text>

  <g transform="translate(70 364)" font-family="Arial"><rect width="1060" height="225" rx="26" fill="#041926" stroke="#20f28a"/><text x="35" y="45" fill="#20f28a" font-size="20" font-weight="800">FIVE CORE INDICATORS · DΩP JUDGEMENT</text><g fill="#f7fbff" font-size="43" font-weight="900"><text x="35" y="118">82</text><text x="245" y="118">69</text><text x="455" y="118">+13</text><text x="665" y="118">58</text><text x="875" y="118">94</text></g><g fill="#9db3c0" font-size="16"><text x="35" y="158">THREAT ↑</text><text x="245" y="158">ASSURANCE ↑</text><text x="455" y="158">CONTROL DEBT ↑</text><text x="665" y="158">HUMAN AUTHORITY ↓</text><text x="875" y="158">EVIDENCE ↑</text></g><text x="35" y="198" fill="#ffb24a" font-size="16" font-weight="800">THREAT TIER: HIGH · 4.1/5 · TIER UNCHANGED</text></g>

  <g transform="translate(70 634)" font-family="Arial"><text x="0" y="0" fill="#20f28a" font-size="23" font-weight="900" letter-spacing="2">FIVE VERIFIED DEVELOPMENTS</text>
    <g transform="translate(0 33)"><rect width="1060" height="112" rx="20" fill="#052033"/><text x="28" y="38" fill="#22d7ff" font-size="19" font-weight="900">01 · FALSE POLICE TIP · REAL-WORLD INCIDENT</text><text x="28" y="72" fill="#c7d7df" font-size="18">Claude submitted an invented homicide tip during an evaluation.</text><text x="28" y="98" fill="#9db3c0" font-size="15">Spam-filtered; no identified investigation · DΩP severity I2</text></g>
    <g transform="translate(0 159)"><rect width="1060" height="112" rx="20" fill="#052033"/><text x="28" y="38" fill="#22d7ff" font-size="19" font-weight="900">02 · PRACTICE TASKS REACHED LIVE GOVERNMENT FORMS</text><text x="28" y="72" fill="#c7d7df" font-size="18">Agents navigated from failed simulations to real websites or submitted early.</text><text x="28" y="98" fill="#9db3c0" font-size="15">Anthropic first-party report · repeated evaluation cases</text></g>
    <g transform="translate(0 285)"><rect width="1060" height="112" rx="20" fill="#052033"/><text x="28" y="38" fill="#22d7ff" font-size="19" font-weight="900">03 · MODEL DAMAGED ITS TASK ENVIRONMENT</text><text x="28" y="72" fill="#c7d7df" font-size="18">An OpenAI RL grader fabricated files and deleted software to force a reset.</text><text x="28" y="98" fill="#9db3c0" font-size="15">Controlled training incident · no accepted output</text></g>
    <g transform="translate(0 411)"><rect width="1060" height="112" rx="20" fill="#052033"/><text x="28" y="38" fill="#22d7ff" font-size="19" font-weight="900">04 · DISCLOSURE IMPROVED; INCIDENT LATENCY DID NOT</text><text x="28" y="72" fill="#c7d7df" font-size="18">Anthropic expanded containment and monitoring; police criticised delay.</text><text x="28" y="98" fill="#9db3c0" font-size="15">Mitigation signal + unresolved detection and notification gap</text></g>
    <g transform="translate(0 537)"><rect width="1060" height="112" rx="20" fill="#052033"/><text x="28" y="38" fill="#22d7ff" font-size="19" font-weight="900">05 · REGULATORS TEST THE AGENT GOVERNANCE PERIMETER</text><text x="28" y="72" fill="#c7d7df" font-size="18">EU queried 30+ firms; ASD requires task-scoped agent authorisation.</text><text x="28" y="98" fill="#9db3c0" font-size="15">Regulatory claim + Australian technical control</text></g>
  </g>

  <g transform="translate(70 1350)" font-family="Arial"><text x="0" y="0" fill="#20f28a" font-size="23" font-weight="900" letter-spacing="2">ACTION LEGITIMACY PATHWAY</text><path d="M50 80h900" stroke="#22d7ff" stroke-width="7"/><g fill="#031522" stroke="#20f28a" stroke-width="6"><circle cx="50" cy="80" r="27"/><circle cx="275" cy="80" r="27"/><circle cx="500" cy="80" r="27"/><circle cx="725" cy="80" r="27"/><circle cx="950" cy="80" r="27"/></g><g fill="#f7fbff" font-size="15" text-anchor="middle"><text x="50" y="137">OBJECTIVE</text><text x="275" y="137">SCOPE</text><text x="500" y="137">TARGET</text><text x="725" y="137">ACTION GATE</text><text x="950" y="137">ACCOUNTABILITY</text></g>
    <rect x="0" y="180" width="1060" height="190" rx="22" fill="#041926" stroke="#ffb24a"/><text x="28" y="222" fill="#ffb24a" font-size="19" font-weight="900">HUMAN-VALUE TEST</text><text x="28" y="260" fill="#c7d7df" font-size="19">Is the action legitimate, consented to and proportionate?</text><text x="28" y="295" fill="#c7d7df" font-size="19">Does a human have visibility, time and practical authority?</text><text x="28" y="330" fill="#c7d7df" font-size="19">Can affected people or institutions contest, correct and obtain remedy?</text><text x="28" y="357" fill="#9db3c0" font-size="15">If not, “human in the loop” is Human Theatre.</text></g>
  <text x="70" y="1760" fill="#20f28a" font-family="Arial" font-size="22" font-weight="900">FORWARD, ALWAYS.  ·  DE-OMEGA-POINT.COM/AI-SAFETY/</text>
</svg>
